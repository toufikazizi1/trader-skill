name: تقرير الذهب

# يكتب تقرير الذهب (السعر والتحليل والسيناريوهات والأخبار) في reports/latest.md
# وفي reports/YYYY-MM-DD.md. لا ينفّذ أي أمر شراء أو بيع. للقراءة والتقارير فقط.

on:
  schedule:
    # ثلاث مرات في أيام العمل: 06:00 و12:00 و18:00 بتوقيت UTC
    - cron: "0 6,12,18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: توليد تقرير الذهب
        run: python3 scripts/gold_report.py

      - name: حفظ التقرير والحالة في الريبو
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports trader/state
          if git diff --cached --quiet; then
            echo "لا تغييرات للحفظ."
          else
            git commit -m "تقرير الذهب $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
