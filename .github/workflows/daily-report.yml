name: التقرير اليومي

# يشغّل أدوات trader-* ويكتب التقرير في reports/YYYY-MM-DD.md.
# لا ينفّذ أي أمر شراء أو بيع. للقراءة والتقارير فقط.

on:
  schedule:
    # أيام الأسبوع 12:00 بتوقيت UTC (قبل افتتاح بورصة نيويورك صيفاً وشتاءً)
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # SEC تطلب هوية في كل طلب. أضفها في: Settings > Secrets and variables > Actions > Variables
      # باسم SEC_USER_AGENT وبقيمة مثل: Your Name you@example.com
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت pdftotext (لقراءة إفصاحات الكونغرس)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: فحص إعداد SEC
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning::SEC_USER_AGENT غير مضبوط: سيُتخطى قسم 13F وملفات SEC في الأخبار."
          fi

      - name: توليد التقرير
        run: python3 scripts/daily_report.py

      - name: حفظ التقرير والحالة في الريبو
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p trader/state
          git add reports trader/state
          if git diff --cached --quiet; then
            echo "لا تغييرات للحفظ."
          else
            git commit -m "تقرير يومي $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
