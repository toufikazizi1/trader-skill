name: تقرير الذهب

# يكتب تقرير الذهب (السعر والتحليل والسيناريوهات والأخبار) في reports/latest.md
# وفي reports/YYYY-MM-DD.md. لا ينفّذ أي أمر شراء أو بيع. للقراءة والتقارير فقط.

on:
  schedule:
    # كل نصف ساعة في أيام العمل. ملخص كامل إلى Telegram عند 06:00 و12:00 و18:00 UTC،
    # وفي بقية الأوقات تنبيه فقط عند عبور مستوى أو الاقتراب من دعم/مقاومة أو تغيّر الحكم.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: توليد تقرير الذهب
        run: python3 scripts/gold_report.py

      - name: حفظ التقرير والحالة في الريبو
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports trader/state
          if git diff --cached --quiet; then
            echo "لا تغييرات للحفظ."
          else
            git commit -m "تقرير الذهب $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: إرسال الملخص إلى Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/telegram_send.py
          elif [ "$MIN" -lt 30 ] && { [ "$HOUR" = "06" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "18" ]; }; then
            python3 scripts/telegram_send.py
          else
            python3 scripts/telegram_send.py --only-alerts
          fi
